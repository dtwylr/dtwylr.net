<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects - Merrill Datwyler</title>
    <link rel="stylesheet" href="../dtwylr_styles.css" />
  </head>
  <body>
    <div class="page">
      <aside>
        <h1><a href="/">Merrill Datwyler</a></h1>
        <div id="nav-container"></div>
        <script>
			fetch('../nav.html')
			.then(response => response.text())
			.then(data => {
				const nav = document.getElementById('nav-container');
				nav.innerHTML = data;
				const currentPage = window.location.pathname;
				nav.querySelectorAll('a').forEach(link => {
					if (link.pathname === currentPage) {
						link.classList.add('active');
					}
				});
			});
		</script>
      </aside>
      <main>
        <h3>Atrial Fibrillation</h3>
        	<img src="../assets/projects/atrial-fibrillation.png" alt="MicroRNA biomarkers and atrial fibrillation analysis" />
      </main>
    </div>
    <footer>
      <p>&copy; 2026 Merrill Datwyler</p>
    </footer>
  </body>
</html>
